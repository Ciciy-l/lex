name: "Bug report / 缺陷报告"
description: "Report a reproducible problem / 报告一个可复现的问题"
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认这不是安全漏洞;安全问题请按 [SECURITY.md](../blob/main/SECURITY.md) 私下报告。
        Please make sure this is not a security vulnerability — report those privately per SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: "问题描述 / What happened"
      description: "实际行为与期望行为 / Actual vs expected behavior"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "环境 / Environment"
      value: |
        - Lex 版本或 commit / version or commit:
        - 平台与版本 / platform & OS version:
        - 安装方式 / install method:
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "复现步骤 / Steps to reproduce"
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "日志与截图 / Logs & screenshots"
      description: "粘贴前请删除凭证与个人数据 / Redact credentials and personal data before pasting"
