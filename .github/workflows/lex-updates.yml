name: publish-lex-update-manifests

on:
  # Draft releases intentionally do not publish update metadata.  Promote the
  # release only after its assets and notes have been reviewed.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published Lex release tag (for example v0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lex-updates
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Lex update manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify the release is published
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,isPrerelease,publishedAt)"
          if ! jq -e '.isDraft == false and .publishedAt != null' <<<"$release_json" >/dev/null; then
            echo "Release $RELEASE_TAG is still a draft or has not been published; refusing to update the public channel." >&2
            exit 1
          fi
          echo "prerelease=$(jq -r '.isPrerelease' <<<"$release_json")" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        run: |
          rm -rf release-assets generated-manifests
          mkdir -p release-assets generated-manifests
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir release-assets \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.deb' --pattern '*.zip'

      - name: Build platform manifests with checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$RELEASE_PRERELEASE" = true ]; then
            manifest_suffix='-beta'
            echo "MANIFEST_SUFFIX=$manifest_suffix" >> "$GITHUB_ENV"
            echo 'This is a prerelease; publishing beta-channel manifests.' >> "$GITHUB_STEP_SUMMARY"
          else
            manifest_suffix=''
            echo 'MANIFEST_SUFFIX=' >> "$GITHUB_ENV"
            echo 'This is a stable release; publishing release and beta-channel manifests so RC installs can graduate.' >> "$GITHUB_STEP_SUMMARY"
          fi
          export MANIFEST_SUFFIX="$manifest_suffix"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re

          root = pathlib.Path('release-assets')
          out = pathlib.Path('generated-manifests')
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          suffix = os.environ.get('MANIFEST_SUFFIX', '')
          # RC publishes beta only. Stable advances both channels so a user who
          # installed an RC receives the corresponding stable build without
          # manually changing Settings.
          manifest_suffixes = [suffix] if suffix else ['', '-beta']
          base = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"
          files = sorted(p for p in root.iterdir() if p.is_file())
          runtime_snapshot_path = pathlib.Path('config/lex-agent-runtime-assets.json')
          try:
              runtime_snapshot = json.loads(runtime_snapshot_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"invalid pinned runtime snapshot: {error}") from error
          if runtime_snapshot.get('schemaVersion') != 1:
              raise SystemExit('unsupported pinned runtime snapshot schema')
          runtime_cdn_base = str(runtime_snapshot.get('cdnBaseUrl', '')).rstrip('/')
          runtime_platforms = runtime_snapshot.get('platforms')
          if not re.fullmatch(r'https://[^\s]+', runtime_cdn_base):
              raise SystemExit('pinned runtime CDN base must be an absolute HTTPS URL')
          if not isinstance(runtime_platforms, dict):
              raise SystemExit('pinned runtime snapshot platforms must be an object')

          def pick(pattern):
              matches = [p for p in files if pattern.search(p.name)]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one asset matching {pattern.pattern!r}, got {[p.name for p in matches]}")
              return matches[0]

          def asset(path):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              return {
                  'file': f"{base}/{path.name}",
                  'sha256': digest,
                  'size': path.stat().st_size,
              }

          def runtime_assets(platform):
              """Project the release tag's pinned CLI assets for older clients."""
              source = runtime_platforms.get(platform)
              if not isinstance(source, dict):
                  raise SystemExit(f"pinned runtime snapshot is missing platform {platform}")
              result = {}
              required = {'claudeCode', 'codex', 'codexPackage', 'pi'}
              for key in ('claudeCode', 'codex', 'codexPackage', 'ripgrep', 'pi'):
                  value = source.get(key)
                  if not isinstance(value, dict):
                      if key in required:
                          raise SystemExit(f"pinned runtime snapshot {platform} is missing {key}")
                      continue
                  value = dict(value)
                  runtime_file = str(value.get('file', '')).strip()
                  if re.fullmatch(r'https://[^\s]+', runtime_file):
                      value['file'] = runtime_file
                  else:
                      path_parts = pathlib.PurePosixPath(runtime_file).parts
                      if (
                          not runtime_file
                          or runtime_file.startswith(('/', '\\'))
                          or '\\' in runtime_file
                          or '..' in path_parts
                          or '://' in runtime_file
                      ):
                          raise SystemExit(f"unsafe pinned runtime path for {platform}/{key}")
                      value['file'] = f"{runtime_cdn_base}/{runtime_file}"
                  result[key] = value
              return result

          def app_payload(platform, app):
              payload = {'app': app}
              payload.update(runtime_assets(platform))
              return payload

          def write_platform_manifest(platform, payload):
              body = json.dumps(payload, indent=2) + '\n'
              for output_suffix in manifest_suffixes:
                  (out / f'manifest-{platform}{output_suffix}.json').write_text(body)

          # New releases use self-explanatory public names. Keep the old rc.5
          # patterns as a read-only compatibility path so a manual manifest
          # rebuild for an already-published release remains possible.
          escaped_version = re.escape(version)
          win_hotfix = pick(re.compile(
              rf'^Lex-{escaped_version}-(?:Windows-x64-Auto-Update|hotfix)\.zip$', re.I
          ))
          win_installer = pick(re.compile(
              rf'^Lex-{escaped_version}-(?:Windows-x64-)?Setup\.exe$', re.I
          ))
          write_platform_manifest('win32-x64', app_payload('win32-x64', {
              'version': version, 'releaseNotes': f'Lex {version}',
              'hotfix': asset(win_hotfix), 'installer': asset(win_installer)
          }))

          for arch, public_arch in (('arm64', 'Apple-Silicon'), ('x64', 'Intel')):
              hotfix = pick(re.compile(
                  rf'^Lex-{escaped_version}-(?:macOS-{public_arch}-Auto-Update|{arch}-hotfix)\.zip$', re.I
              ))
              # All new signed and unsigned builds publish a DMG for manual
              # installation. The old ZIP alternative only supports immutable
              # releases created before the naming/DMG migration.
              installer = pick(re.compile(
                  rf'^Lex-{escaped_version}-(?:macOS-{public_arch}\.dmg|{arch}\.(?:dmg|zip))$', re.I
              ))
              write_platform_manifest(f'darwin-{arch}', app_payload(f'darwin-{arch}', {
                  'version': version, 'releaseNotes': f'Lex {version}',
                  'hotfix': asset(hotfix), 'installer': asset(installer)
              }))

          linux = pick(re.compile(
              rf'^Lex-{escaped_version}-(?:Linux-x64|amd64)\.deb$', re.I
          ))
          write_platform_manifest('linux-x64', app_payload('linux-x64', {
              'version': version, 'releaseNotes': f'Lex {version}',
              'installer': asset(linux)
          }))
          PY

      - name: Publish manifests to the Lex updates branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          worktree="$(mktemp -d)"
          trap 'rm -rf "$worktree"' EXIT
          if git ls-remote --exit-code "$repo_url" refs/heads/updates >/dev/null 2>&1; then
            git clone --depth=1 --branch updates "$repo_url" "$worktree/repo"
          else
            git init "$worktree/repo"
            git -C "$worktree/repo" checkout --orphan updates
            git -C "$worktree/repo" remote add origin "$repo_url"
          fi
          # RC updates beta only. Stable advances both release and beta so
          # prerelease installs can graduate; untouched channels stay in place.
          cp generated-manifests/* "$worktree/repo/"
          git -C "$worktree/repo" config user.name 'github-actions[bot]'
          git -C "$worktree/repo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$worktree/repo" add .
          if git -C "$worktree/repo" diff --cached --quiet; then
            echo 'Update manifests are unchanged.'
            exit 0
          fi
          git -C "$worktree/repo" commit -s -m "chore: publish Lex ${RELEASE_TAG} update manifests"
          git -C "$worktree/repo" push origin HEAD:updates
