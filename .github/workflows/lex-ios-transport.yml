name: lex-ios-transport

on:
  pull_request:
    paths:
      - 'apps/mobile/modules/lex-service-websocket/**'
      - 'scripts/test-lex-ios-websocket.mjs'
      - '.github/workflows/lex-ios-transport.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/modules/lex-service-websocket/**'
      - 'scripts/test-lex-ios-websocket.mjs'
      - '.github/workflows/lex-ios-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      XDT_SKIP_AGENT_BIN_INSTALL: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check real Foundation transport in debug and release
        run: node scripts/test-lex-ios-websocket.mjs
