name: lex-ios-unsigned

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact-only version (major.minor.patch or -alpha.N/-beta.N/-rc.N)'
        required: true
        default: '0.1.15'
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned iPhone IPA
    # SDK 57 requires Xcode >= 26.4 / Swift >= 6.3. macos-15 stops at 26.3.
    # Standard arm64 runner; see the linked inventory in lex-ios-distribution.md.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CI: '1'
      LEX_MOBILE_BUILD: '1'
      LEX_MOBILE_VERSION: ${{ inputs.version }}
      EXPO_PUBLIC_CINDY_AUTH_REGION: global
      EXPO_NO_DOTENV: '1'
      XDT_SKIP_AGENT_BIN_INSTALL: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LEX_IOS_REQUIRE_PINNED_TOOLCHAIN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check iOS publishing contracts
        run: node --test scripts/__tests__/lex-ios-release.test.mjs
      - name: Materialize public development manifest for Metro resolution
        run: |
          if [ ! -e config/endpoint.dev.json ]; then
            cp config/endpoint.dev.json.example config/endpoint.dev.json
          fi
      - name: Verify compiler compatibility and build offline unsigned iphoneos arm64 Release
        run: node scripts/build-lex-ios.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-${{ inputs.version }}
          path: |
            dist/ios/Lex-${{ inputs.version }}-iOS-unsigned.ipa
            dist/ios/Lex-${{ inputs.version }}-iOS-unsigned.update.json
            dist/ios/build-info.json
          if-no-files-found: error
          retention-days: 14
