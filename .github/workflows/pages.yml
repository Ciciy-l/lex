name: deploy-lex-website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "config/lex-product.json"
      - "scripts/generate-lex-website-release.mjs"
      - ".github/workflows/pages.yml"
  # A release event keeps the tag as its deployment ref, which may be rejected by the
  # github-pages environment when it is protected for main only. Wait for the update
  # manifests workflow instead: workflow_run executes this workflow from the default branch.
  workflow_run:
    workflows: [publish-lex-update-manifests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lex-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the public site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            website
            config/lex-product.json
            scripts/generate-lex-website-release.mjs

      - name: Generate stable release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_file="$RUNNER_TEMP/lex-releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$api_file"
          node scripts/generate-lex-website-release.mjs "$api_file" website/release.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
