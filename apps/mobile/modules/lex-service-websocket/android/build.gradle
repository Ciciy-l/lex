plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'io.github.ciciyl.lex.transport'
version = '0.1.0'
android {
  namespace 'io.github.ciciyl.lex.transport'
  buildFeatures { buildConfig true }
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
  }
}
// Match the existing React Native lock; this module does not upgrade networking.
dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.2'
  testImplementation 'com.squareup.okhttp3:okhttp-tls:4.9.2'
}
